<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Agente de I.A</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f2f7;
    --muted: #7a8099;
    --accent: #4f8ef7;
    --accent2: #3dd68c;
    --accent3: #f7a94f;
    --accent4: #a78bfa;
    --danger: #f7614f;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 10px var(--accent2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .logo-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .period-select {
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
  }

  .period-select:focus { border-color: var(--accent); }

  .refresh-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.2s;
  }

  .refresh-btn:hover { opacity: 0.85; }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn.loading { opacity: 0.6; pointer-events: none; }

  .status-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    color: var(--muted);
  }

  .status-badge.ok { color: var(--accent2); border-color: rgba(61,214,140,0.3); background: rgba(61,214,140,0.08); }
  .status-badge.err { color: var(--danger); border-color: rgba(247,97,79,0.3); background: rgba(247,97,79,0.08); }
  .status-badge.loading { color: var(--accent); border-color: rgba(79,142,247,0.3); background: rgba(79,142,247,0.08); }

  /* CONFIG */
  .config-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .config-field {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 220px;
  }

  .config-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    font-family: var(--mono);
  }

  .config-input {
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 8px;
    flex: 1;
    outline: none;
    transition: border-color 0.2s;
  }

  .config-input:focus { border-color: var(--accent); }

  /* MAIN */
  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .metric-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .metric-card:hover { border-color: var(--border2); }

  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 12px 12px 0 0;
  }

  .metric-card.blue::before { background: var(--accent); }
  .metric-card.green::before { background: var(--accent2); }
  .metric-card.amber::before { background: var(--accent3); }
  .metric-card.purple::before { background: var(--accent4); }
  .metric-card.red::before { background: var(--danger); }

  .metric-icon {
    font-size: 18px;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .metric-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
    font-family: var(--mono);
  }

  .metric-value {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -1px;
    line-height: 1;
  }

  .metric-card.blue .metric-value { color: var(--accent); }
  .metric-card.green .metric-value { color: var(--accent2); }
  .metric-card.amber .metric-value { color: var(--accent3); }
  .metric-card.purple .metric-value { color: var(--accent4); }
  .metric-card.red .metric-value { color: var(--danger); }

  .metric-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
    font-family: var(--mono);
  }

  /* GRID */
  .charts-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }

  .chart-title {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 16px;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
  }

  /* CONTACTS */
  .contacts-list { display: flex; flex-direction: column; gap: 10px; }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .contact-rank {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    width: 16px;
    text-align: right;
    flex-shrink: 0;
  }

  .contact-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .contact-name {
    font-size: 13px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contact-bar-bg {
    width: 80px;
    height: 4px;
    background: var(--bg3);
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .contact-bar-fill {
    height: 4px;
    border-radius: 4px;
    background: var(--accent);
  }

  .contact-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    width: 28px;
    text-align: right;
    flex-shrink: 0;
  }

  /* EMPTY */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 13px;
    gap: 8px;
    text-align: center;
  }

  .empty-icon { font-size: 28px; opacity: 0.4; }

  /* SPIN */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 0.8s linear infinite; display: inline-block; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .charts-row { grid-template-columns: 1fr; }
    main { padding: 20px 16px; }
    header { padding: 16px; }
    .config-bar { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">Agente de I.A</div>
      <div class="logo-sub">WhatsApp Analytics</div>
    </div>
  </div>
  <div class="header-right">
    <select class="period-select" id="period-sel">
      <option value="7">Últimos 7 dias</option>
      <option value="14">Últimos 14 dias</option>
      <option value="30" selected>Últimos 30 dias</option>
      <option value="90">Últimos 90 dias</option>
    </select>
    <button class="refresh-btn" id="load-btn">
      <span id="btn-icon">↻</span> Atualizar
    </button>
    <span class="status-badge" id="status-badge">aguardando</span>
  </div>
</header>

<div class="config-bar">
  <div class="config-field">
    <span class="config-label">SUPABASE URL</span>
    <input class="config-input" type="text" id="sb-url" value="https://kvnafqbknqfqwffyagor.supabase.co" />
  </div>
  <div class="config-field">
    <span class="config-label">API KEY</span>
    <input class="config-input" type="password" id="sb-key" placeholder="sb_publishable_..." />
  </div>
</div>

<main>

  <div class="metrics" id="metrics-grid">
    <div class="metric-card blue">
      <div class="metric-label">Total mensagens</div>
      <div class="metric-value" id="m-total">—</div>
    </div>
    <div class="metric-card green">
      <div class="metric-label">Recebidas</div>
      <div class="metric-value" id="m-recv">—</div>
    </div>
    <div class="metric-card amber">
      <div class="metric-label">Enviadas</div>
      <div class="metric-value" id="m-sent">—</div>
    </div>
    <div class="metric-card purple">
      <div class="metric-label">Contatos únicos</div>
      <div class="metric-value" id="m-contacts">—</div>
    </div>
    <div class="metric-card green">
      <div class="metric-label">Novos contatos</div>
      <div class="metric-value" id="m-new">—</div>
      <div class="metric-sub">últimos 7 dias</div>
    </div>
    <div class="metric-card blue">
      <div class="metric-label">Pico de horário</div>
      <div class="metric-value" id="m-peak">—</div>
      <div class="metric-sub" id="m-peak-sub"></div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Mensagens por dia</div>
      <div class="chart-wrap" style="height:220px;">
        <canvas id="chart-daily" role="img" aria-label="Mensagens por dia"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Top contatos</div>
      <div class="contacts-list" id="contacts-list">
        <div class="empty">
          <div class="empty-icon">📭</div>
          <div>Carregue os dados</div>
        </div>
      </div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Distribuição por hora</div>
      <div class="chart-wrap" style="height:200px;">
        <canvas id="chart-hour" role="img" aria-label="Mensagens por hora do dia"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Dias da semana mais ativos</div>
      <div class="chart-wrap" style="height:200px;">
        <canvas id="chart-dow" role="img" aria-label="Mensagens por dia da semana"></canvas>
      </div>
    </div>
  </div>

</main>

<script>
const charts = {};

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
};

function initDaily(labels, recv, sent) {
  destroyChart('daily');
  charts['daily'] = new Chart(document.getElementById('chart-daily'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Recebidas', data: recv, backgroundColor: 'rgba(79,142,247,0.7)', borderRadius: 4, borderSkipped: false },
        { label: 'Enviadas', data: sent, backgroundColor: 'rgba(61,214,140,0.6)', borderRadius: 4, borderSkipped: false }
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      scales: {
        x: { stacked: false, ticks: { color: '#7a8099', font: { size: 10, family: 'DM Mono' }, autoSkip: true, maxRotation: 45 }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.07)' } },
        y: { ticks: { color: '#7a8099', font: { size: 11, family: 'DM Mono' } }, grid: { color: 'rgba(255,255,255,0.05)' }, border: { color: 'transparent' } }
      }
    }
  });
}

function initHour(labels, data) {
  destroyChart('hour');
  charts['hour'] = new Chart(document.getElementById('chart-hour'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data, backgroundColor: (ctx) => {
        const max = Math.max(...data);
        const v = data[ctx.dataIndex];
        const alpha = 0.3 + (v / max) * 0.7;
        return `rgba(167,139,250,${alpha})`;
      }, borderRadius: 3, borderSkipped: false }]
    },
    options: {
      ...CHART_DEFAULTS,
      scales: {
        x: { ticks: { color: '#7a8099', font: { size: 9, family: 'DM Mono' } }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.07)' } },
        y: { ticks: { color: '#7a8099', font: { size: 11, family: 'DM Mono' } }, grid: { color: 'rgba(255,255,255,0.05)' }, border: { color: 'transparent' } }
      }
    }
  });
}

function initDow(labels, data) {
  destroyChart('dow');
  charts['dow'] = new Chart(document.getElementById('chart-dow'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data, backgroundColor: (ctx) => {
        const max = Math.max(...data);
        const v = data[ctx.dataIndex];
        const alpha = 0.3 + (v / max) * 0.7;
        return `rgba(247,169,79,${alpha})`;
      }, borderRadius: 4, borderSkipped: false }]
    },
    options: {
      ...CHART_DEFAULTS,
      scales: {
        x: { ticks: { color: '#7a8099', font: { size: 11, family: 'DM Mono' } }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.07)' } },
        y: { ticks: { color: '#7a8099', font: { size: 11, family: 'DM Mono' } }, grid: { color: 'rgba(255,255,255,0.05)' }, border: { color: 'transparent' } }
      }
    }
  });
}

function setStatus(type, text) {
  const el = document.getElementById('status-badge');
  el.className = 'status-badge ' + type;
  el.textContent = text;
}

function setLoading(on) {
  const btn = document.getElementById('load-btn');
  const icon = document.getElementById('btn-icon');
  btn.classList.toggle('loading', on);
  icon.classList.toggle('spinning', on);
}

function initials(name) {
  if (!name) return '?';
  return name.trim().split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
}

const AVATAR_COLORS = [
  ['rgba(79,142,247,0.2)', '#4f8ef7'],
  ['rgba(61,214,140,0.2)', '#3dd68c'],
  ['rgba(247,169,79,0.2)', '#f7a94f'],
  ['rgba(167,139,250,0.2)', '#a78bfa'],
  ['rgba(247,97,79,0.2)', '#f7614f'],
];

async function loadData() {
  const url = document.getElementById('sb-url').value.trim();
  const key = document.getElementById('sb-key').value.trim();
  const days = parseInt(document.getElementById('period-sel').value);

  if (!url || !key) { setStatus('err', 'configure a key'); return; }

  setLoading(true);
  setStatus('loading', 'carregando...');

  
  
  

  try {
    const res = await fetch(`${url}/rest/v1/mensagens?select=*&order=data_hora.asc&limit=10000`, {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('resposta inesperada');
    setStatus('ok', rows.length + ' registros');
    processData(rows, days);
  } catch(e) {
    setStatus('err', e.message);
  } finally {
    setLoading(false);
  }
}

function processData(rows, days) {
  const recv = rows.filter(r => r.fromme === false || r.fromme === 'false');
  const sent = rows.filter(r => r.fromme === true || r.fromme === 'true');

  document.getElementById('m-total').textContent = rows.length;
  document.getElementById('m-recv').textContent = recv.length;
  document.getElementById('m-sent').textContent = sent.length;

  const contacts = {};
  recv.forEach(r => {
    const k = r.remetente || 'desconhecido';
    if (!contacts[k]) contacts[k] = { name: r.nome || k, count: 0, first: r.data_hora };
    contacts[k].count++;
  });
  document.getElementById('m-contacts').textContent = Object.keys(contacts).length;

  const cutNew = new Date();
  cutNew.setDate(cutNew.getDate() - 7);
  const newC = Object.values(contacts).filter(c => c.first && new Date(c.first) >= cutNew).length;
  document.getElementById('m-new').textContent = newC;

  const hourBuckets = Array(24).fill(0);
  recv.forEach(r => { if (r.data_hora) hourBuckets[new Date(r.data_hora).getHours()]++; });
  const peakH = hourBuckets.indexOf(Math.max(...hourBuckets));
  document.getElementById('m-peak').textContent = peakH + 'h';
  document.getElementById('m-peak-sub').textContent = hourBuckets[peakH] + ' msgs nesse horário';

  const dayMap = {};
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    dayMap[d.toISOString().slice(0,10)] = { recv: 0, sent: 0 };
  }
  recv.forEach(r => { const k = (r.data_hora||'').slice(0,10); if (dayMap[k]) dayMap[k].recv++; });
  sent.forEach(r => { const k = (r.data_hora||'').slice(0,10); if (dayMap[k]) dayMap[k].sent++; });
  const dayKeys = Object.keys(dayMap);
  initDaily(dayKeys.map(d => d.slice(5)), dayKeys.map(k => dayMap[k].recv), dayKeys.map(k => dayMap[k].sent));

  const hLabels = Array.from({length:24}, (_,i) => i+'h');
  initHour(hLabels, hourBuckets);

  const dowBuckets = Array(7).fill(0);
  recv.forEach(r => { if (r.data_hora) dowBuckets[new Date(r.data_hora).getDay()]++; });
  initDow(['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'], dowBuckets);

  const sorted = Object.entries(contacts).sort((a,b) => b[1].count - a[1].count).slice(0,8);
  const maxCount = sorted[0]?.[1].count || 1;
  const cl = document.getElementById('contacts-list');
  if (!sorted.length) {
    cl.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>Sem dados</div></div>';
    return;
  }
  cl.innerHTML = sorted.map(([, c], i) => {
    const [bg, color] = AVATAR_COLORS[i % AVATAR_COLORS.length];
    const pct = Math.round(c.count / maxCount * 100);
    return `<div class="contact-row">
      <span class="contact-rank">${i+1}</span>
      <div class="contact-avatar" style="background:${bg};color:${color}">${initials(c.name)}</div>
      <span class="contact-name">${c.name}</span>
      <div class="contact-bar-bg"><div class="contact-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="contact-count">${c.count}</span>
    </div>`;
  }).join('');
}

document.getElementById('load-btn').addEventListener('click', loadData);
document.getElementById('period-sel').addEventListener('change', () => {
  if (document.getElementById('sb-key').value.trim()) loadData();
});
</script>
</body>
</html>
